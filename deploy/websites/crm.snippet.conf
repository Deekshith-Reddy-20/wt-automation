# --- BEGIN VFARMS_CRM_VHOST (managed by deploy/websites/install-crm-vhost.sh) ---
server {
    listen 80;
    listen [::]:80;
    server_name crm.vfarms.in;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/cueai;
        default_type text/plain;
    }

    location / {
        return 301 https://crm.vfarms.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.vfarms.in;

    ssl_certificate     /etc/nginx/certs/vfarms-crm/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vfarms-crm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_VFARMS_CRM:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $vfarms_crm_upstream vfarms-crm-app:3000;
        proxy_pass http://$vfarms_crm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
# --- END VFARMS_CRM_VHOST ---
